[project]
name = "genmo"
version = "0.1.0"
description = "Genmo models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "addict>=2.4.0",
    "av>=18.1.0",
    "click>=8.1.7",
    "einops>=0.8.0",
    "gradio>=6.30.0,<7",
    "moviepy>=2.2.1,<3",
    "omegaconf>=2.3.0",
    "pillow>=13.0.0,<14",
    "pyyaml>=6.0.2",
    "ray>=2.59.0",
    "sentencepiece>=0.2.2",
    "setuptools>=75.2.0",
    "torch>=2.14.1",
    "torchvision>=0.19.1",
    "transformers==5.20.2",
]

[project.optional-dependencies]
flash = [
    "flash-attn>=2.8.3.post2"
]

torchvision = [
    "torchvision>=0.15.0",
    "av>=18.1.0"
]

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 120

[tool.uv]
# MoviePy and Gradio cap Pillow below the security-fixed release. CPU media
# regression tests cover this override. Use uv sync so the override applies.
override-dependencies = ["pillow>=13.0.0,<14"]
